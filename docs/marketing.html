<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 정보 수신 (선택) | 지미커</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #222222;
    --muted: #666666;
    --line: #e6e7ee;
    --accent: #6b7af5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171c;
      --card: #1e1f26;
      --text: #e8e8ea;
      --muted: #a0a0a8;
      --line: #2e2f38;
      --accent: #8c98ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  .brand {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-decoration: none;
  }
  h1 { font-size: 25px; margin: 10px 0 6px; line-height: 1.35; }
  .meta { font-size: 13px; color: var(--muted); margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 22px;
  }
  .doc {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    margin: 0;
    font-family: inherit;
  }
  h2 { font-size: 17px; margin: 26px 0 8px; }
  h2:first-child { margin-top: 0; }
  p { margin: 0 0 12px; font-size: 14.5px; }
  ul { margin: 0 0 12px; padding-left: 20px; font-size: 14.5px; }
  li { margin-bottom: 6px; }
  a { color: var(--accent); }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { margin: 0 0 10px; }
  .list a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
  }
  .list .tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .callout {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    margin: 0 0 16px;
  }
  footer {
    margin-top: 34px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./">지미커</a>
    <h1>마케팅 정보 수신 (선택)</h1>
    <p class="meta">시행일: 2026년 8월 14일</p>
  </header>
  <div class="card"><div class="doc">동의하시면 아래 정보를 알림으로 보내드립니다.

   - 신규 창고 소식, 할인·이벤트 안내
   - 서비스 개선 사항 안내

동의하지 않아도 서비스 이용에는 아무런 제한이 없습니다.
예약 승인, 새 메시지처럼 거래에 꼭 필요한 알림은 이 동의와 관계없이
발송됩니다.

동의는 [내 정보]에서 언제든 철회할 수 있습니다.</div></div>
  <footer>지미커 · 문의 <a href="mailto:TODO-이메일을-적어주세요@example.com">TODO-이메일을-적어주세요@example.com</a></footer>
</div>
</body>
</html>
