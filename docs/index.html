  a { color: var(--accent); }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { margin: 0 0 10px; }
  .list a {

    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
  }
  .list .tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);

  .callout {

    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    margin: 0 0 16px;

  footer {
