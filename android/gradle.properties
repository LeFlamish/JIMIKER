org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 빌드에 쓸 자바 지정에 관하여.
#
# Flutter는 JAVA_HOME보다 Android Studio "내장" 자바(JBR)를 먼저 쓰는데,
# 최신 Android Studio의 내장 자바(25)는 Gradle이 아직 지원하지 않아
# "What went wrong: 25.x.x"로 빌드가 깨진다.
#
# 해결: 터미널에서 한 번만 실행해 Flutter가 쓸 자바를 못 박는다.
#   flutter config --jdk-dir "C:\Program Files\Java\jdk-17"  (본인 JDK 17 경로)
# JDK 17이면 충분하다(안드로이드 빌드 최소 요구). 아래 줄로 강제할 수도
# 있지만 PC마다 경로가 달라 기본은 꺼 둔다. (윈도우에서도 / 를 쓴다)
#org.gradle.java.home=C:/Program Files/Java/jdk-17
